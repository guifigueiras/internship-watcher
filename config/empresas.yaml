# Empresas vigiadas pelo vigilante de estágios (rascunho v1, outubro 2026).
#
# Campos de cada empresa:
#   nome        nome da empresa (aparece nas mensagens e serve para pesquisar notícias)
#   setor       tecnologia | consultoria | banca | seguros | energia | telecom | retalho | consumo | industria | investigacao
#   site        página principal OU de carreiras. No passo 2, um detetor automático
#               encontra a página de carreiras e a plataforma de recrutamento a partir daqui.
#   prioridade  1 = muito relevante / prestígio, 2 = relevante, 3 = vigiar por precaução
#   notas       opcional: o que já se sabe (nome do programa, quando abriu no ano passado)
#   carreiras   opcional: página de carreiras escrita à mão (tem prioridade sobre a deteção)
#   plataforma  opcional: {tipo: greenhouse, id: farfetch}, escrita à mão quando já se sabe;
#               "plataforma: null" obriga a vigiar a página (ignora o que o detetor encontrou)
#   vigiar_pagina opcional: false para nunca abrir as páginas desta empresa (só notícias)
#
# Podes acrescentar ou apagar empresas à vontade, mantendo o formato.
# Critério: escritório em Lisboa ou arredores (o estágio é presencial).

