name: Testes

# Corre os testes automáticos sempre que envias código (git push).
# Se ficar vermelho, alguma alteração partiu um leitor, um filtro ou a memória.
on:
  push:
    paths: ["vigilante/**", "tests/**", "requirements*.txt", "config/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validar a lista de empresas
        run: python -c "from vigilante.config import carregar_fontes; print(len(carregar_fontes()), 'empresas OK')"
      - name: Testes
        run: python -m pytest -q
